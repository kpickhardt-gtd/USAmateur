<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hole Station — Oak Hill Marshal Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="hole-page">

<header class="hole-header">
  <a href="#" class="back-link" id="back-link" aria-label="Back to course">&larr;</a>
  <div class="hole-header__text">
    <span class="hole-header__eyebrow" id="hole-eyebrow">Oak Hill</span>
    <h1 class="hole-header__title" id="hole-title">Hole &mdash;</h1>
  </div>
  <span class="hole-flag" id="hole-par"></span>
</header>

<div id="map"></div>

<section class="hole-info" id="hole-info">
  <h2 class="hole-info__heading">Your station</h2>
  <ul class="marshal-list" id="marshal-list"></ul>
  <p class="hole-info__note">
    Tap a highlighted circle on the map for details. Pinch to zoom in on the satellite view for the exact spot.
  </p>
</section>

<nav class="hole-pager" id="hole-pager"></nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/holes-data.js"></script>
<script src="js/app.js"></script>
<script>
  renderHolePage();
</script>
</body>
</html>
