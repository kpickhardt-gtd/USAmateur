<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hole Station — Oak Hill Marshal Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css"/>
<link rel="stylesheet" href="style.css">
</head>
<body class="hole-page">

<header class="hole-header">
  <a href="#" class="back-link" id="back-link" aria-label="Back to course">&larr;</a>
  <div class="hole-header__text">
    <span class="hole-header__eyebrow" id="hole-eyebrow">Oak Hill</span>
    <h1 class="hole-header__title" id="hole-title">Hole &mdash;</h1>
  </div>
  <span class="hole-flag" id="hole-par"></span>
</header>

<div class="map-frame">
  <div id="map"></div>
  <button type="button" class="map-recenter" id="hole-recenter">Recentre hole</button>
</div>

<p class="admin-warning" id="hole-no-image" hidden>
  This hole hasn't been prepared yet — there's no hole image for it.
</p>

<section class="hole-info" id="hole-info">
  <h2 class="hole-info__heading">Your station</h2>
  <ul class="marshal-list" id="marshal-list"></ul>
  <p class="hole-info__note">
    The tee is marked <strong>T</strong> and the green <strong>G</strong>. Tap a red circle for
    details on that station. Pinch to zoom in for the exact spot, then tap
    <em>Recentre hole</em> to snap back.
  </p>
</section>

<nav class="hole-pager" id="hole-pager"></nav>

<script src="leaflet.js"></script>
<script src="leaflet-rotate.js"></script>
<script src="holes-data.js"></script>
<script src="app.js"></script>
<script>
  renderHolePage();
</script>
</body>
</html>
